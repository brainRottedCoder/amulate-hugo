name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voltway-erp
    env:
      BUDGET_STORE: memory
      HUGO_TOOL_CALLING: 'true'
      HUGO_MEMORY: 'true'
      HUGO_RAG: 'true'
      # Placeholder so getFireworksConfig unit paths that need a key can set their own
      FIREWORKS_API_KEY: fw_ci_placeholder
      NEXT_PUBLIC_FIREBASE_API_KEY: test
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: voltway-erp/package.json
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Lint (phase-critical paths)
        run: npx eslint src/lib/auth src/lib/tenants src/lib/observability src/lib/privacy src/app/api/admin src/app/api/privacy --max-warnings=0
      - name: Playwright install
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (skipped without E2E creds)
        run: npx playwright test tests/e2e/login.spec.ts tests/e2e/hugo-phase5.spec.ts
        continue-on-error: true
